name: OpenCode AI Automation

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  opencode-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run OpenCode Action
        uses: opencode-ai/action@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
